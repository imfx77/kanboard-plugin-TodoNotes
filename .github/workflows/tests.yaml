name: Unit Tests

on:
  workflow_dispatch:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  Sqlite:
    runs-on: ubuntu-latest
    #container: kanboard/tests:latest
    steps:
    - name: Checkout Kanboard repo
      uses: actions/checkout@v4
      with:
        repository: kanboard/kanboard
    - name: Checkout Plugin repo
      uses: actions/checkout@v4
      with:
        path: plugins/TodoNotes
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-suggest
    - name: Unit tests with Sqlite
      run: ./vendor/bin/phpunit -c tests/units.sqlite.xml plugins/TodoNotes/Test/

  Sqlite-PHP8:
    runs-on: ubuntu-latest
    #container: kanboard/tests:latest
    steps:
    - name: Checkout Kanboard repo
      uses: actions/checkout@v4
      with:
        repository: kanboard/kanboard
    - name: Checkout Plugin repo
      uses: actions/checkout@v4
      with:
        path: plugins/TodoNotes
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-suggest
    - name: Unit tests with Sqlite
      run: ./vendor/bin/phpunit -c tests/units.sqlite.xml plugins/TodoNotes/Test/

  Postgres:
    runs-on: ubuntu-latest
    #container: kanboard/tests:latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kanboard_unit_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
        - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - name: Checkout Kanboard repo
      uses: actions/checkout@v4
      with:
        repository: kanboard/kanboard
    - name: Checkout Plugin repo
      uses: actions/checkout@v4
      with:
        path: plugins/TodoNotes
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-suggest
    - name: Unit tests with Postgres
      run: ./vendor/bin/phpunit -c tests/units.postgres.xml plugins/TodoNotes/Test/
      env:
        DB_HOSTNAME: localhost
        DB_PORT: ${{ job.services.postgres.ports[5432] }}

  MariaDB:
    runs-on: ubuntu-latest
    #container: kanboard/tests:latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MARIADB_ROOT_PASSWORD: secret
          MARIADB_USER: root
          MARIADB_DATABASE: kanboard_unit_test
        ports:
        - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - name: Checkout Kanboard repo
      uses: actions/checkout@v4
      with:
        repository: kanboard/kanboard
    - name: Checkout Plugin repo
      uses: actions/checkout@v4
      with:
        path: plugins/TodoNotes
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-suggest
    - name: Unit tests with MariaDB
      run: ./vendor/bin/phpunit -c tests/units.mysql.xml plugins/TodoNotes/Test/
      env:
        DB_HOSTNAME: 127.0.0.1
        DB_PASSWORD: secret
        DB_USERNAME: root
        DB_PORT: ${{ job.services.mariadb.ports[3306] }}
